[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "psychology-learning-server"
version = "0.1.0"
description = "Backend for the psychology learning platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "email-validator>=2,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "redis>=5,<7",
  "httpx>=0.28,<1",
  "python-ulid>=2.7,<3",
  "pyjwt>=2.10,<3",
  "bcrypt>=4.2,<5",
  "minio>=7.2,<8",
  "python-multipart>=0.0.20,<0.1",
  "pypdf>=5.1,<7",
  "PyMuPDF>=1.26,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI 依赖注入的标准用法即在参数默认值中调用 Depends()
ignore = ["B008"]
